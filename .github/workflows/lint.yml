name: Lint & Format

# 质量门禁：ESLint（可能出错的地方）+ Prettier（排版）+ 构建与产物校验
#
# 部署已迁到 Cloudflare Workers：在 Cloudflare 侧把仓库连上 Git（Workers Builds）
# 之后，master 的推送自动构建部署，非生产分支 / PR 自动生成预览。
# 仓库里不再保留部署流水线，也不再需要 CLOUDFLARE_* secrets。
# 所以这里除了风格检查，还要自己把构建跑一遍：检查不过就不该发版。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint + Prettier + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先查排版：报错信息是「哪个文件没按 Prettier 排」，比 lint 报错更好定位
      - name: Prettier (format:check)
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      # nuxi generate + sync-fonts + verify-output：构建不过或产物缺页直接失败
      - name: Build
        run: pnpm run build
